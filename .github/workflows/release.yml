name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${JSON.parse(require("fs").readFileSync("package.json")).version}`) process.exit(1)'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm release:build
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" "release-assets/$RELEASE_TAG/"*
          --verify-tag
          --title "BewlyCatAntiJunk $RELEASE_TAG"
          --notes-file "release-assets/$RELEASE_TAG/INSTALL.md"
          --generate-notes
